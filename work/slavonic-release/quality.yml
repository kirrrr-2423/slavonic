# Source-tree workflow template. It never builds or publishes native installers.
name: Source quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Pins verified against official actions/* releases on 2026-10-29.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare desktop sources
        run: python work/slavonic-release/prepare_release.py
      - name: Generate staged PWA from the same renderer
        run: python work/slavonic-release/web/build_web.py
      - name: Run language, editor, practice, release and PWA checks
        run: python work/slavonic-release/check_all.py --web
